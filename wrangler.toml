name = "stylo-preview"
main = "index.mjs"
compatibility_date = "2025-09-01"

[vars]
MODEL = "gemini-nano-banana-2.1"
# Your web app address(es), comma separated, no trailing slash. Example: https://yourname.github.io
ALLOWED_ORIGINS = "https://YOUR-USERNAME.github.io"
# The desktop app sends the origin "null". Set to "false" if you do not ship the desktop app.
ALLOW_NULL_ORIGIN = "true"
PER_DEVICE = "3"      # previews per device per day
PER_IP = "10"         # previews per network address per day
DAILY_CAP = "100"     # previews per day across everyone: your spending limit
THINKING = "minimal"  # minimal, medium or high. Higher costs more.

[[kv_namespaces]]
binding = "LIMITS"
id = "REPLACE_WITH_YOUR_KV_ID"
